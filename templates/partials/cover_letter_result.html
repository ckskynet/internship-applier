<div class="cl-result">
    <div class="cl-header">
        <h3>Cover Letter — {{ job.title }} @ {{ job.company }}</h3>
        <span class="badge badge-{% if cl_status == 'required' %}error{% elif cl_status == 'optional' %}warning{% else %}new{% endif %}">
            {{ cl_status }}
        </span>
    </div>
    {% if cl_text %}
    <pre class="cl-text">{{ cl_text }}</pre>
    <div class="cl-actions">
        <span class="cl-path">Saved to: {{ cl_path }}</span>
        <div style="display:flex;gap:0.5rem;">
            <a href="/cover-letters/{{ docx_filename }}" class="btn btn-download" download>
                Download .docx
            </a>
            <button class="btn btn-apply" onclick="navigator.clipboard.writeText(document.querySelector('.cl-text').textContent);this.textContent='Copied!'">
                Copy text
            </button>
        </div>
    </div>
    {% elif error %}
    <p class="cl-error">{{ error }}</p>
    {% endif %}
</div>
